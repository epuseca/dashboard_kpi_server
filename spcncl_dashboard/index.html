<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiến độ triển khai SPCNCL, SP Bộ giao — Trung tâm 4</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #eef1f6;
      --card: #ffffff;
      --navy: #1e3a8a;
      --navy-deep: #14245c;
      --ink: #1c2430;
      --ink-soft: #6b7385;
      --line: #e6e9f0;
      --green: #2f9e5b;
      --amber: #d99a1f;
      --red: #d0453a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 28px 40px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .title-wrap {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--navy-deep);
      line-height: 1.2;
    }

    .title-sub {
      font-size: 12.5px;
      color: var(--ink-soft);
      line-height: 1.3;
      white-space: nowrap;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* date filter */
    .date-select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .date-select-wrap svg.cal-icon {
      position: absolute;
      left: 11px;
      width: 14px;
      height: 14px;
      color: var(--navy);
      pointer-events: none;
    }

    select#dateFilter {
      appearance: none;
      -webkit-appearance: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 32px 9px 32px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    .date-select-wrap svg.chevron {
      position: absolute;
      right: 10px;
      width: 12px;
      height: 12px;
      color: var(--ink-soft);
      pointer-events: none;
    }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .dl-btn svg {
      width: 13px;
      height: 13px;
    }

    .dl-btn:hover {
      background: var(--navy-deep);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--navy);
      border-radius: 8px;
      padding: 9px 15px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }

    .nav-btn svg {
      width: 13px;
      height: 13px;
    }

    .nav-btn:hover {
      background: #eaeff9;
    }

    /* toggle */
    .toggle-group {
      display: flex;
      background: #e3e7f0;
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
      flex: none;
    }

    .toggle-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .toggle-btn.active {
      background: #fff;
      color: var(--navy);
      box-shadow: 0 1px 3px rgba(20, 36, 92, 0.12);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 24px 24px;
      box-shadow: 0 1px 3px rgba(20, 36, 92, 0.05);
    }

    /* table header row (labels above bars) */
    .col-head-row {
      display: grid;
      grid-template-columns: 30px 260px 1fr 140px 1.4fr;
      gap: 12px;
      padding: 0 0 10px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .col-head-row span {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }

    .col-head-row span.center {
      text-align: center;
    }

    /* rows */
    .bar-row {
      display: grid;
      grid-template-columns: 30px 260px 1fr 140px 1.4fr;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }

    .bar-row:last-child {
      border-bottom: none;
    }

    .bar-num {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .bar-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.35;
    }

    .bar-track {
      position: relative;
      height: 20px;
      background: #f1f3f8;
      border-radius: 5px;
      overflow: visible;
    }

    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 5px;
      width: 0%;
      transition: width .7s cubic-bezier(.16, .8, .3, 1);
    }

    .bar-fill.good {
      background: var(--green);
    }

    .bar-fill.warn {
      background: var(--amber);
    }

    .bar-fill.bad {
      background: var(--red);
    }

    .bar-pct-inline {
      position: absolute;
      right: 8px;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* status */
    .status-cell {
      display: flex;
      align-items: center;
      gap: 7px;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
    }

    .status-dot.on_track {
      background: var(--green);
    }

    .status-dot.at_risk {
      background: var(--amber);
    }

    .status-dot.delayed {
      background: var(--red);
    }

    .status-cell.on_track {
      color: var(--green);
    }

    .status-cell.at_risk {
      color: var(--amber);
    }

    .status-cell.delayed {
      color: var(--red);
    }

    /* issue */
    .issue-cell {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    .issue-cell.empty {
      color: #b7bcc7;
    }

    .issue-cell ul {
      margin: 0;
      padding-left: 16px;
    }

    .issue-cell li {
      margin-bottom: 3px;
    }

    .issue-cell li:last-child {
      margin-bottom: 0;
    }

    .legend-row {
      display: flex;
      gap: 20px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: var(--ink-soft);
      flex-wrap: wrap;
    }

    .legend-row span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .footline {
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-top: 14px;
      text-align: right;
    }

    @media (max-width: 820px) {

      .col-head-row,
      .bar-row {
        grid-template-columns: 22px 160px 1fr 110px 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="topbar">
      <div class="title-wrap">
        <h1>Tiến độ triển khai SPCNCL, SP Bộ giao</h1>
        <div class="title-sub" style="display: none;">Trung tâm 4 · Kỳ theo dõi: Tháng 09/2026</div>
      </div>
      <div class="topbar-right">

        <a class="nav-btn" href="../admin/index.html" title="Trang quản trị dữ liệu">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2.5a2 2 0 010-4h.09A1.65 1.65 0 004.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2.5a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21.5a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
          </svg>

        </a>
        <div class="date-select-wrap">
          <svg class="cal-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          <select id="dateFilter"></select>
          <svg class="chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
        <button class="dl-btn" id="downloadBtn" style="display: none;">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
          </svg>
          Tải dữ liệu (.xlsx)
        </button>
        <div class="toggle-group">
          <button class="toggle-btn active" data-mode="month">% so KH tháng</button>
          <button class="toggle-btn" data-mode="approved">% so KH phê duyệt</button>
        </div>
        <a class="nav-btn" href="../index.html">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6" />
          </svg>
          Dashboard KPI
        </a>
      </div>
    </div>

    <div class="card">
      <div class="col-head-row">
        <span></span>
        <span>Tên nhiệm vụ</span>
        <span id="colBarLabel">% so với KH tháng</span>
        <span class="center">Trạng thái</span>
        <span>Khó khăn, vướng mắc</span>
      </div>

      <div id="itemsContainer"></div>

      <div class="legend-row">
        <span><span class="lg-dot" style="background:var(--green);"></span>Đúng tiến độ</span>
        <span><span class="lg-dot" style="background:var(--amber);"></span>Có nguy cơ chậm</span>
        <span><span class="lg-dot" style="background:var(--red);"></span>Chậm tiến độ</span>
      </div>
    </div>

    <div class="footline" id="footline">Nguồn dữ liệu: Tiến độ triển khai SPCNCL, SP Bộ giao — Trung tâm 4</div>

  </div>

  <script>
    // ---------------------------------------------------------------
    // SPCNCL_RECORDS được nạp từ API /api/spcncl (MongoDB), không còn dùng data.js
    // ---------------------------------------------------------------

    let SPCNCL_RECORDS = [];
    let currentMode = 'month'; // 'month' | 'approved'
    let currentRecord = null;

    function formatDateVN(isoDate) {
      const [y, m, d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    function ratioClass(ratio) {
      if (ratio >= 90) return 'good';
      if (ratio >= 70) return 'warn';
      return 'bad';
    }

    const STATUS_LABEL = {
      on_track: 'Đúng tiến độ',
      at_risk: 'Có nguy cơ chậm',
      delayed: 'Chậm tiến độ'
    };

    // Chuyển "—" hoặc chuỗi rỗng thành ô trống; nếu có nhiều dòng (\n) thì render dạng danh sách gạch đầu dòng
    function renderIssueHTML(issue) {
      const isEmpty = !issue || issue.trim() === '' || issue.trim() === '—';
      if (isEmpty) return { html: '—', empty: true };

      const lines = issue.split('\n').map(s => s.trim()).filter(Boolean);
      if (lines.length <= 1) {
        return { html: lines[0] || issue, empty: false };
      }
      const liHtml = lines.map(l => `<li>${l}</li>`).join('');
      return { html: `<ul>${liHtml}</ul>`, empty: false };
    }

    function populateDateFilter() {
      const select = document.getElementById('dateFilter');
      const sorted = [...SPCNCL_RECORDS].sort((a, b) => b.updateDate.localeCompare(a.updateDate));
      sorted.forEach(rec => {
        const opt = document.createElement('option');
        opt.value = rec.updateDate;
        opt.textContent = `${formatDateVN(rec.updateDate)}`;
        select.appendChild(opt);
      });
      select.value = sorted[0].updateDate;
      select.addEventListener('change', () => {
        renderRecord(select.value);
      });
    }

    function getRecordByDate(dateStr) {
      return SPCNCL_RECORDS.find(r => r.updateDate === dateStr);
    }

    function renderRecord(dateStr) {
      const record = getRecordByDate(dateStr);
      if (!record) return;
      currentRecord = record;

      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      record.items.forEach(item => {
        const clsMonth = item.statusMonth || ratioClass(item.pctMonth);
        const clsApproved = item.statusApproved || ratioClass(item.pctApproved);
        const { html: issueHtml, empty: issueEmpty } = renderIssueHTML(item.issue);

        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
      <div class="bar-num">${item.id}</div>
      <div class="bar-label">${item.name}</div>
      <div class="bar-track">
        <div class="bar-fill"
             data-month="${item.pctMonth}" data-approved="${item.pctApproved}"
             data-cls-month="${ratioClass(item.pctMonth)}" data-cls-approved="${ratioClass(item.pctApproved)}"></div>
        <div class="bar-pct-inline" data-month-text="${item.pctMonth}%" data-approved-text="${item.pctApproved}%">${item.pctMonth}%</div>
      </div>
      <div class="status-cell" data-status-month="${clsMonth}" data-status-approved="${clsApproved}">
        <span class="status-dot"></span><span class="status-text"></span>
      </div>
      <div class="issue-cell ${issueEmpty ? 'empty' : ''}">${issueHtml}</div>
    `;
        container.appendChild(row);
      });

      document.getElementById('footline').textContent =
        `Nguồn dữ liệu: Tiến độ triển khai SPCNCL, SP Bộ giao — Trung tâm 4 · Dữ liệu tính đến ngày: ${formatDateVN(record.updateDate)}`;

      applyMode(currentMode, false);
      animateBars();
    }

    function animateBars() {
      const bars = document.querySelectorAll('.bar-row .bar-fill');
      bars.forEach((bar, i) => {
        bar.style.width = '0%';
        const target = currentMode === 'month' ? bar.getAttribute('data-month') : bar.getAttribute('data-approved');
        setTimeout(() => { bar.style.width = target + '%'; }, 60 + i * 55);
      });
    }

    function applyMode(mode, animate) {
      currentMode = mode;
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

      document.getElementById('colBarLabel').textContent =
        mode === 'month' ? '% so với KH tháng' : '% so với KH phê duyệt (toàn dự án)';

      document.querySelectorAll('.bar-row .bar-fill').forEach(bar => {
        const cls = mode === 'month' ? bar.getAttribute('data-cls-month') : bar.getAttribute('data-cls-approved');
        bar.classList.remove('good', 'warn', 'bad');
        bar.classList.add(cls);
        if (!animate) {
          const target = mode === 'month' ? bar.getAttribute('data-month') : bar.getAttribute('data-approved');
          bar.style.width = target + '%';
        }
      });

      document.querySelectorAll('.bar-pct-inline').forEach(el => {
        el.textContent = mode === 'month' ? el.getAttribute('data-month-text') : el.getAttribute('data-approved-text');
      });

      document.querySelectorAll('.status-cell').forEach(cell => {
        const status = mode === 'month' ? cell.getAttribute('data-status-month') : cell.getAttribute('data-status-approved');
        cell.classList.remove('on_track', 'at_risk', 'delayed');
        cell.classList.add(status);
        cell.querySelector('.status-dot').className = `status-dot ${status}`;
        cell.querySelector('.status-text').textContent = STATUS_LABEL[status] || status;
      });

      if (animate) animateBars();
    }

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => applyMode(btn.dataset.mode, false));
    });

    // ---------------------------------------------------------------
    // Xuất Excel (.xlsx) cho ngày đang xem
    // ---------------------------------------------------------------
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!currentRecord) return;

      // Ưu tiên 1: nếu record có khai báo excelFile => tải thẳng file có sẵn trong thư mục excel/
      if (currentRecord.excelFile) {
        const a = document.createElement('a');
        a.href = currentRecord.excelFile;
        a.download = currentRecord.excelFile.split('/').pop();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return;
      }

      // Ưu tiên 2 (dự phòng): không có excelFile => tự tạo file Excel từ dữ liệu
      const rows = [];
      rows.push(['STT', 'Tên nhiệm vụ', '% so với KH tháng', 'Trạng thái (KH tháng)', '% so với KH phê duyệt', 'Trạng thái (KH phê duyệt)', 'Khó khăn, vướng mắc', 'Dữ liệu tính đến ngày']);

      currentRecord.items.forEach(item => {
        rows.push([
          item.id,
          item.name,
          item.pctMonth / 100,
          STATUS_LABEL[item.statusMonth] || item.statusMonth,
          item.pctApproved / 100,
          STATUS_LABEL[item.statusApproved] || item.statusApproved,
          item.issue && item.issue.trim() !== '—' ? item.issue.replace(/\n/g, ' | ') : '—',
          formatDateVN(currentRecord.updateDate)
        ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [
        { wch: 6 },
        { wch: 40 },
        { wch: 16 },
        { wch: 18 },
        { wch: 18 },
        { wch: 18 },
        { wch: 50 },
        { wch: 16 }
      ];
      // Format cột % (C, E — index 2, 4) dạng phần trăm
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let r = 1; r <= range.e.r; r++) {
        [2, 4].forEach(c => {
          const cellRef = XLSX.utils.encode_cell({ r, c });
          if (ws[cellRef]) ws[cellRef].z = '0%';
        });
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'SPCNCL');

      const fileName = `SPCNCL_TrungTam4_${currentRecord.updateDate}.xlsx`;
      XLSX.writeFile(wb, fileName);
    });

    // ---------------------------------------------------------------
    // Khởi tạo — nạp dữ liệu từ MongoDB qua API rồi mới render
    // ---------------------------------------------------------------
    async function loadData() {
      const container = document.getElementById('itemsContainer') || document.querySelector('.card');
      try {
        const res = await fetch('/api/spcncl');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        SPCNCL_RECORDS = await res.json();
      } catch (err) {
        console.error('Không tải được dữ liệu SPCNCL:', err);
        if (container) container.innerHTML = '<p style="padding:20px;color:#b42318">Không tải được dữ liệu từ máy chủ. Vui lòng thử lại sau.</p>';
        return;
      }
      if (!SPCNCL_RECORDS.length) {
        if (container) container.innerHTML = '<p style="padding:20px;color:#6b7385">Chưa có dữ liệu. Vui lòng cập nhật trong trang quản trị (/admin/).</p>';
        return;
      }
      populateDateFilter();
      renderRecord(document.getElementById('dateFilter').value);
    }
    loadData();
  </script>
</body>

</html>
