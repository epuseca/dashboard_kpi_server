<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị dữ liệu — Trung tâm 4</title>
<style>
  :root{
    --navy:#1c3d6e; --navy-deep:#122c52; --bg:#f2f4f8; --card:#fff;
    --border:#e2e6ee; --text:#1c2333; --muted:#6b7385;
    --green:#1e8a5f; --amber:#b98900; --red:#b42318; --info:#0b5fae; --info-bg:#eaf2ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=date],input[type=number],input[type=password],textarea,select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fbfcfe;
  }
  textarea{resize:vertical;min-height:60px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:180px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:10px 18px;
    font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn-outline:hover{background:#eaeff9;}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn-danger:hover{background:#fde8e6;}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab-btn{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);}
  .tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  .hidden{display:none !important;}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .msg-error{background:#fdecea;color:var(--red);}
  .msg-ok{background:#e9f7ef;color:var(--green);}
  .msg-info{background:var(--info-bg);color:var(--info);}
  .login-box{max-width:360px;margin:80px auto 0;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;flex:none;}
  .icon-btn:hover{color:var(--red);}
  a.linkback{font-size:12.5px;color:var(--navy);text-decoration:none;font-weight:600;}

  /* ---- KPI: mục lớn / KPI nhỏ ---- */
  .kpi-group{border:1.5px solid var(--navy); border-radius:12px; padding:16px; margin-bottom:18px; background:#f7f9fd;}
  .kpi-group-head{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .kpi-group-code{width:90px; flex:none; font-weight:700; text-align:center;}
  .kpi-group-name{flex:1; font-weight:600;}
  .kpi-group-items{display:flex; flex-direction:column; gap:10px;}
  .kpi-item-row{border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff;}
  .kpi-item-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .kpi-item-numname{display:flex; align-items:center; gap:8px; flex:1; min-width:240px;}
  .kpi-item-stt{width:56px; flex:none; text-align:center; font-weight:700; background:#eef2fb;}
  .kpi-item-name{flex:1; font-weight:600;}
  .kpi-item-controls{display:flex; align-items:center; gap:8px; flex:none;}
  .kpi-item-type{width:170px; flex:none;}
  .kpi-item-insert-below{margin-top:10px; text-align:center; border-top:1px dashed var(--border); padding-top:8px;}
  .btn-inline-add{background:none; border:1px dashed var(--navy); color:var(--navy); border-radius:7px; padding:5px 12px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .btn-inline-add:hover{background:#eaeff9;}
  .kpi-group-additem{margin-top:12px;}
  #kpiAddGroupBtn{margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Quản trị dữ liệu — Trung tâm 4</h1>
      <div class="sub">Cập nhật số liệu KPI và tiến độ SPCNCL, lưu trực tiếp lên MongoDB.</div>
    </div>
    <div style="display:flex; gap:10px;">
      <a class="linkback" href="../index.html">← Dashboard KPI</a>
      <a class="linkback" href="../spcncl_dashboard/index.html">Dashboard SPCNCL →</a>
    </div>
  </div>

  <!-- ============ LOGIN ============ -->
  <div id="loginView" class="card login-box hidden">
    <h1 style="font-size:17px;">Đăng nhập quản trị</h1>
    <div id="loginMsg"></div>
    <label>Mật khẩu quản trị</label>
    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu">
    <div style="margin-top:16px;">
      <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">Đăng nhập</button>
    </div>
  </div>

  <!-- ============ ADMIN ============ -->
  <div id="adminView" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="tabs">
        <button class="tab-btn active" data-tab="kpi">KPI</button>
        <button class="tab-btn" data-tab="spcncl">SPCNCL / SP Bộ giao</button>
      </div>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Đăng xuất</button>
    </div>

    <!-- ---------- KPI TAB ---------- -->
    <div id="kpiTab">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <strong>Các kỳ cập nhật KPI</strong>
          <button class="btn btn-primary btn-sm" id="kpiNewBtn">+ Thêm kỳ mới</button>
        </div>
        <table id="kpiTable">
          <thead><tr><th>Ngày cập nhật</th><th>Tổng điểm</th><th>Số mục lớn</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card hidden" id="kpiEditorCard">
        <div id="kpiMsg"></div>
        <div class="row">
          <div>
            <label>Ngày cập nhật</label>
            <input type="date" id="kpiDate">
          </div>
          <div>
            <label>Tổng điểm KPI (VD: 95.01)</label>
            <input type="number" step="0.01" id="kpiTotalScore">
          </div>
        </div>

        <label style="margin-top:22px;">Các mục lớn (viễn cảnh chiến lược) và KPI trong từng mục</label>
        <div id="kpiGroupsContainer"></div>
        <button class="btn btn-outline btn-sm" id="kpiAddGroupBtn">+ Thêm mục lớn</button>

        <div style="margin-top:20px;display:flex;gap:10px;">
          <button class="btn btn-primary" id="kpiSaveBtn">Lưu kỳ cập nhật</button>
          <button class="btn btn-outline" id="kpiCancelBtn">Hủy</button>
        </div>
      </div>
    </div>

    <!-- ---------- SPCNCL TAB ---------- -->
    <div id="spcnclTab" class="hidden">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <strong>Các kỳ cập nhật SPCNCL</strong>
          <button class="btn btn-primary btn-sm" id="spcnclNewBtn">+ Thêm kỳ mới</button>
        </div>
        <table id="spcnclTable">
          <thead><tr><th>Ngày cập nhật</th><th>Số nhiệm vụ</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card hidden" id="spcnclEditorCard">
        <div id="spcnclMsg"></div>
        <label>Ngày cập nhật</label>
        <input type="date" id="spcnclDate" style="max-width:220px;">

        <div id="spcnclItemsContainer" style="margin-top:16px;"></div>
        <button class="btn btn-outline btn-sm" id="spcnclAddRowBtn" style="margin-top:6px;">+ Thêm nhiệm vụ</button>
        <div style="margin-top:16px;display:flex;gap:10px;">
          <button class="btn btn-primary" id="spcnclSaveBtn">Lưu kỳ cập nhật</button>
          <button class="btn btn-outline" id="spcnclCancelBtn">Hủy</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// =================================================================
// Tiện ích chung
// =================================================================
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function formatDateVN(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function escapeAttr(str){
  return String(str == null ? '' : str).replace(/"/g, '&quot;');
}
function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let kpiRecords = [];
let spcnclRecords = [];

// =================================================================
// Auth
// =================================================================
async function checkAuth(){
  const res = await fetch('/api/auth');
  const data = await res.json();
  if (data.authenticated) {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('adminView').classList.remove('hidden');
    loadKpiList();
    loadSpcnclList();
  } else {
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('adminView').classList.add('hidden');
  }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const password = document.getElementById('loginPassword').value;
  const msgEl = document.getElementById('loginMsg');
  msgEl.innerHTML = '';
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  const data = await res.json();
  if (!res.ok) {
    msgEl.innerHTML = `<div class="msg msg-error">${data.error || 'Đăng nhập thất bại'}</div>`;
    return;
  }
  document.getElementById('loginPassword').value = '';
  checkAuth();
});

document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'logout' }),
  });
  checkAuth();
});

// =================================================================
// Tabs
// =================================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('kpiTab').classList.toggle('hidden', tab !== 'kpi');
    document.getElementById('spcnclTab').classList.toggle('hidden', tab !== 'spcncl');
  });
});

// =================================================================
// KPI — danh sách
// =================================================================
async function loadKpiList(){
  const res = await fetch('/api/kpi');
  kpiRecords = await res.json(); // API đã trả về sắp xếp mới nhất trước
  const tbody = document.querySelector('#kpiTable tbody');
  tbody.innerHTML = '';
  if (!kpiRecords.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted);">Chưa có dữ liệu.</td></tr>';
    return;
  }
  kpiRecords.forEach(r => {
    const tr = document.createElement('tr');
    const soMuc = (r.groups || []).length;
    tr.innerHTML = `
      <td>${formatDateVN(r.updateDate)}</td>
      <td>${r.totalScore != null ? r.totalScore + '%' : '—'}</td>
      <td>${soMuc}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn btn-outline btn-sm" data-edit="${r.updateDate}">Sửa</button>
        <button class="btn btn-danger btn-sm" data-del="${r.updateDate}">Xóa</button>
      </td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openKpiEditor(b.dataset.edit)));
  tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteKpi(b.dataset.del)));
}

async function deleteKpi(date){
  if (!confirm(`Xóa kỳ cập nhật KPI ngày ${formatDateVN(date)}?`)) return;
  const res = await fetch('/api/kpi?date=' + encodeURIComponent(date), { method: 'DELETE' });
  if (res.ok) loadKpiList();
  else alert('Xóa thất bại.');
}

// =================================================================
// KPI — xây dựng mục lớn / KPI nhỏ (DOM động, không dùng template cố định)
// =================================================================
function nextKpiStt(){
  return document.querySelectorAll('#kpiGroupsContainer .kpi-item-stt').length + 1;
}

function createKpiItemRow(item, defaultStt){
  const isNumber = !!(item && item.valueNumber);
  const stt = (item && item.id != null) ? item.id : defaultStt;
  const row = document.createElement('div');
  row.className = 'kpi-item-row';
  row.innerHTML = `
    <div class="kpi-item-top">
      <div class="kpi-item-numname">
        <input type="number" class="kpi-item-stt" value="${stt}" title="Số thứ tự KPI">
        <input type="text" class="kpi-item-name" placeholder="Tên KPI" value="${escapeAttr(item ? item.name : '')}">
      </div>
      <div class="kpi-item-controls">
        <select class="kpi-item-type">
          <option value="text" ${!isNumber ? 'selected' : ''}>Nội dung (chữ)</option>
          <option value="number" ${isNumber ? 'selected' : ''}>Định lượng (số)</option>
        </select>
        <button type="button" class="icon-btn kpi-item-remove" title="Xóa KPI này">Xóa ✕</button>
      </div>
    </div>
    <div class="kpi-number-fields row" style="${isNumber ? '' : 'display:none;'}">
      <div><label>Thực hiện</label><input type="number" step="any" class="kpi-actual" value="${isNumber ? item.valueNumber.actual : ''}"></div>
      <div><label>Chỉ tiêu</label><input type="number" step="any" class="kpi-target" value="${isNumber ? item.valueNumber.target : ''}"></div>
      <div><label>Đơn vị</label><input type="text" class="kpi-unit" value="${isNumber ? escapeAttr(item.valueNumber.unit || '') : ''}" placeholder="tr, %, ..."></div>
    </div>
    <div class="kpi-text-fields" style="${isNumber ? 'display:none;' : ''}">
      <div class="row">
        <div style="flex:2;">
          <label>Nội dung hiển thị</label>
          <input type="text" class="kpi-value-text" value="${item && !isNumber ? escapeAttr(item.valueText || '') : ''}" placeholder="VD: Hoàn thành, Đạt 80%, Không giao chỉ tiêu...">
        </div>
        <div>
          <label>Tỷ lệ % (để trống nếu có sẵn số % trong nội dung)</label>
          <input type="number" class="kpi-ratio" value="${item && !isNumber && item.ratio != null ? item.ratio : ''}">
        </div>
      </div>
    </div>
    <div class="kpi-item-insert-below">
      <button type="button" class="btn-inline-add kpi-item-insert">+ Thêm KPI ngay dưới</button>
    </div>
  `;

  row.querySelector('.kpi-item-type').addEventListener('change', (e) => {
    const showNumber = e.target.value === 'number';
    row.querySelector('.kpi-number-fields').style.display = showNumber ? '' : 'none';
    row.querySelector('.kpi-text-fields').style.display = showNumber ? 'none' : '';
  });

  row.querySelector('.kpi-item-remove').addEventListener('click', () => {
    row.remove();
  });

  row.querySelector('.kpi-item-insert').addEventListener('click', () => {
    const newRow = createKpiItemRow(null, nextKpiStt());
    row.after(newRow);
  });

  return row;
}

function createKpiGroup(group){
  const g = document.createElement('div');
  g.className = 'kpi-group';
  g.innerHTML = `
    <div class="kpi-group-head">
      <input type="text" class="kpi-group-code" placeholder="Mã (VD: I)" value="${escapeAttr(group ? group.code : '')}">
      <input type="text" class="kpi-group-name" placeholder="Tên viễn cảnh / mục lớn" value="${escapeAttr(group ? group.name : '')}">
      <button type="button" class="btn btn-danger btn-sm kpi-group-remove">Xóa mục lớn</button>
    </div>
    <div class="kpi-group-items"></div>
    <button type="button" class="btn btn-outline btn-sm kpi-group-additem">+ Thêm KPI trong mục này</button>
  `;

  g.querySelector('.kpi-group-remove').addEventListener('click', () => {
    if (!confirm('Xóa mục lớn này (và toàn bộ KPI bên trong)?')) return;
    g.remove();
  });

  const itemsContainer = g.querySelector('.kpi-group-items');
  g.querySelector('.kpi-group-additem').addEventListener('click', () => {
    itemsContainer.appendChild(createKpiItemRow(null, nextKpiStt()));
  });

  // Trả về kèm danh sách item cần populate SAU KHI group đã được gắn vào DOM
  // (để nextKpiStt() đếm đúng số KPI đã có trong toàn bộ form).
  g._pendingItems = (group && group.items && group.items.length) ? group.items : [null];
  return g;
}

function renderKpiGroups(groups){
  const container = document.getElementById('kpiGroupsContainer');
  container.innerHTML = '';
  const list = (groups && groups.length) ? groups : [null];
  list.forEach(gr => {
    const g = createKpiGroup(gr);
    container.appendChild(g);
    const itemsContainer = g.querySelector('.kpi-group-items');
    g._pendingItems.forEach(it => {
      itemsContainer.appendChild(createKpiItemRow(it, nextKpiStt()));
    });
    delete g._pendingItems;
  });
}

document.getElementById('kpiAddGroupBtn').addEventListener('click', () => {
  const container = document.getElementById('kpiGroupsContainer');
  const g = createKpiGroup(null);
  container.appendChild(g);
  const itemsContainer = g.querySelector('.kpi-group-items');
  itemsContainer.appendChild(createKpiItemRow(null, nextKpiStt()));
  delete g._pendingItems;
});

// =================================================================
// KPI — mở form thêm/sửa (thêm mới sẽ lấy kỳ gần nhất làm mẫu)
// =================================================================
document.getElementById('kpiNewBtn').addEventListener('click', () => openKpiEditor(null));
document.getElementById('kpiCancelBtn').addEventListener('click', () => {
  document.getElementById('kpiEditorCard').classList.add('hidden');
});

function openKpiEditor(date){
  const record = date ? kpiRecords.find(r => r.updateDate === date) : null;
  const msgEl = document.getElementById('kpiMsg');
  msgEl.innerHTML = '';

  document.getElementById('kpiDate').value = record ? record.updateDate : '';
  document.getElementById('kpiTotalScore').value = record ? (record.totalScore != null ? record.totalScore : '') : '';

  let groupsToRender = null;
  if (record) {
    groupsToRender = record.groups;
  } else if (kpiRecords.length) {
    const latest = kpiRecords[0]; // đã sắp xếp mới nhất trước
    groupsToRender = deepClone(latest.groups);
    msgEl.innerHTML = `<div class="msg msg-info">Đã lấy dữ liệu kỳ gần nhất (${formatDateVN(latest.updateDate)}) làm mẫu — chỉnh sửa số liệu bên dưới rồi lưu thành kỳ mới (đừng quên đổi Ngày cập nhật).</div>`;
  }

  renderKpiGroups(groupsToRender);

  document.getElementById('kpiEditorCard').classList.remove('hidden');
  document.getElementById('kpiEditorCard').scrollIntoView({ behavior: 'smooth' });
}

// =================================================================
// KPI — lưu
// =================================================================
document.getElementById('kpiSaveBtn').addEventListener('click', async () => {
  const msgEl = document.getElementById('kpiMsg');
  msgEl.innerHTML = '';
  const updateDate = document.getElementById('kpiDate').value;
  const totalScoreRaw = document.getElementById('kpiTotalScore').value;
  const totalScore = totalScoreRaw === '' ? null : parseFloat(totalScoreRaw);

  if (!updateDate) { msgEl.innerHTML = '<div class="msg msg-error">Vui lòng chọn ngày cập nhật.</div>'; return; }

  const groupEls = document.querySelectorAll('#kpiGroupsContainer .kpi-group');
  if (!groupEls.length) { msgEl.innerHTML = '<div class="msg msg-error">Cần ít nhất 1 mục lớn.</div>'; return; }

  let hasError = false;
  const groups = Array.from(groupEls).map(g => {
    const code = g.querySelector('.kpi-group-code').value.trim();
    const name = g.querySelector('.kpi-group-name').value.trim();
    if (!name) hasError = true;

    const itemEls = g.querySelectorAll('.kpi-item-row');
    if (!itemEls.length) hasError = true;

    const items = Array.from(itemEls).map(row => {
      const id = Number(row.querySelector('.kpi-item-stt').value) || 0;
      const iname = row.querySelector('.kpi-item-name').value.trim();
      const type = row.querySelector('.kpi-item-type').value;
      if (!iname) hasError = true;
      const item = { id, name: iname };
      if (type === 'number') {
        const actual = parseFloat(row.querySelector('.kpi-actual').value);
        const target = parseFloat(row.querySelector('.kpi-target').value);
        const unit = row.querySelector('.kpi-unit').value.trim();
        if (isNaN(actual) || isNaN(target)) hasError = true;
        item.valueNumber = { actual, target, unit };
      } else {
        const valueText = row.querySelector('.kpi-value-text').value.trim();
        const ratioRaw = row.querySelector('.kpi-ratio').value;
        item.valueText = valueText;
        if (ratioRaw !== '') item.ratio = Number(ratioRaw);
      }
      return item;
    });

    return { code, name, items };
  });

  if (hasError) {
    msgEl.innerHTML = '<div class="msg msg-error">Kiểm tra lại: mỗi mục lớn cần Tên + ít nhất 1 KPI; mỗi KPI cần Tên; KPI định lượng cần đủ Thực hiện/Chỉ tiêu.</div>';
    return;
  }

  const res = await fetch('/api/kpi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ updateDate, totalScore, groups }),
  });
  const data = await res.json();
  if (!res.ok) {
    msgEl.innerHTML = `<div class="msg msg-error">${data.error || 'Lưu thất bại'}</div>`;
    return;
  }
  msgEl.innerHTML = '<div class="msg msg-ok">Đã lưu.</div>';
  loadKpiList();
  setTimeout(() => document.getElementById('kpiEditorCard').classList.add('hidden'), 600);
});

// =================================================================
// SPCNCL — danh sách
// =================================================================
async function loadSpcnclList(){
  const res = await fetch('/api/spcncl');
  spcnclRecords = await res.json(); // API đã trả về sắp xếp mới nhất trước
  const tbody = document.querySelector('#spcnclTable tbody');
  tbody.innerHTML = '';
  if (!spcnclRecords.length) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:var(--muted);">Chưa có dữ liệu.</td></tr>';
    return;
  }
  spcnclRecords.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${formatDateVN(r.updateDate)}</td>
      <td>${r.items.length}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn btn-outline btn-sm" data-edit="${r.updateDate}">Sửa</button>
        <button class="btn btn-danger btn-sm" data-del="${r.updateDate}">Xóa</button>
      </td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openSpcnclEditor(b.dataset.edit)));
  tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteSpcncl(b.dataset.del)));
}

async function deleteSpcncl(date){
  if (!confirm(`Xóa kỳ cập nhật SPCNCL ngày ${formatDateVN(date)}?`)) return;
  const res = await fetch('/api/spcncl?date=' + encodeURIComponent(date), { method: 'DELETE' });
  if (res.ok) loadSpcnclList();
  else alert('Xóa thất bại.');
}

// =================================================================
// SPCNCL — form sửa/thêm (thêm mới sẽ lấy kỳ gần nhất làm mẫu)
// =================================================================
document.getElementById('spcnclNewBtn').addEventListener('click', () => openSpcnclEditor(null));
document.getElementById('spcnclCancelBtn').addEventListener('click', () => {
  document.getElementById('spcnclEditorCard').classList.add('hidden');
});
document.getElementById('spcnclAddRowBtn').addEventListener('click', () => addSpcnclRow(null));

function openSpcnclEditor(date){
  const record = date ? spcnclRecords.find(r => r.updateDate === date) : null;
  const msgEl = document.getElementById('spcnclMsg');
  msgEl.innerHTML = '';
  document.getElementById('spcnclDate').value = record ? record.updateDate : '';

  const container = document.getElementById('spcnclItemsContainer');
  container.innerHTML = '';

  if (record) {
    record.items.forEach(it => addSpcnclRow(it));
  } else if (spcnclRecords.length) {
    const latest = spcnclRecords[0]; // đã sắp xếp mới nhất trước
    deepClone(latest.items).forEach(it => addSpcnclRow(it));
    msgEl.innerHTML = `<div class="msg msg-info">Đã lấy dữ liệu kỳ gần nhất (${formatDateVN(latest.updateDate)}) làm mẫu — chỉnh sửa lại cho phù hợp rồi lưu thành kỳ mới (đừng quên đổi Ngày cập nhật).</div>`;
  } else {
    addSpcnclRow(null);
  }

  document.getElementById('spcnclEditorCard').classList.remove('hidden');
  document.getElementById('spcnclEditorCard').scrollIntoView({ behavior: 'smooth' });
}

const STATUS_OPTIONS = [
  { value: 'on_track', label: 'Đúng tiến độ' },
  { value: 'at_risk', label: 'Có nguy cơ chậm' },
  { value: 'delayed', label: 'Chậm tiến độ' },
];

function addSpcnclRow(item){
  const container = document.getElementById('spcnclItemsContainer');
  const defaultStt = document.querySelectorAll('#spcnclItemsContainer .spcncl-row').length + 1;
  const stt = (item && item.id != null) ? item.id : defaultStt;

  const div = document.createElement('div');
  div.className = 'spcncl-row';
  div.style.cssText = 'border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:#fbfcfe;';
  const statusOptionsHtml = (selected) => STATUS_OPTIONS.map(o =>
    `<option value="${o.value}" ${o.value === selected ? 'selected' : ''}>${o.label}</option>`).join('');

  div.innerHTML = `
    <div class="item-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;">
      <div style="display:flex;align-items:center;gap:10px;flex:1;">
        <input type="number" class="sp-stt" value="${stt}" title="STT" style="width:64px;flex:none;font-weight:700;text-align:center;">
        <label style="margin:0;">Tên nhiệm vụ</label>
      </div>
      <button class="icon-btn" data-remove>Xóa nhiệm vụ ✕</button>
    </div>
    <input type="text" class="sp-name" value="${escapeAttr(item ? item.name : '')}" placeholder="VD: SPCNCL01">
    <div class="row" style="margin-top:10px;">
      <div>
        <label>% so với KH tháng</label>
        <input type="number" class="sp-pct-month" value="${item ? item.pctMonth : 0}">
      </div>
      <div>
        <label>Trạng thái (so KH tháng)</label>
        <select class="sp-status-month">${statusOptionsHtml(item ? item.statusMonth : 'on_track')}</select>
      </div>
      <div>
        <label>% so với KH phê duyệt</label>
        <input type="number" class="sp-pct-approved" value="${item ? item.pctApproved : 0}">
      </div>
      <div>
        <label>Trạng thái (so KH phê duyệt)</label>
        <select class="sp-status-approved">${statusOptionsHtml(item ? item.statusApproved : 'on_track')}</select>
      </div>
    </div>
    <label>Khó khăn, vướng mắc (mỗi dòng là 1 gạch đầu dòng, để trống hoặc "—" nếu không có)</label>
    <textarea class="sp-issue">${item ? escapeHtml(item.issue || '') : '—'}</textarea>
  `;
  container.appendChild(div);
  div.querySelector('[data-remove]').addEventListener('click', () => div.remove());
}

document.getElementById('spcnclSaveBtn').addEventListener('click', async () => {
  const msgEl = document.getElementById('spcnclMsg');
  msgEl.innerHTML = '';
  const updateDate = document.getElementById('spcnclDate').value;

  if (!updateDate) { msgEl.innerHTML = '<div class="msg msg-error">Vui lòng chọn ngày cập nhật.</div>'; return; }

  const rows = document.querySelectorAll('#spcnclItemsContainer .spcncl-row');
  if (!rows.length) { msgEl.innerHTML = '<div class="msg msg-error">Cần ít nhất 1 nhiệm vụ.</div>'; return; }

  const items = Array.from(rows).map((div, idx) => ({
    id: Number(div.querySelector('.sp-stt').value) || (idx + 1),
    name: div.querySelector('.sp-name').value.trim(),
    pctMonth: Number(div.querySelector('.sp-pct-month').value) || 0,
    statusMonth: div.querySelector('.sp-status-month').value,
    pctApproved: Number(div.querySelector('.sp-pct-approved').value) || 0,
    statusApproved: div.querySelector('.sp-status-approved').value,
    issue: div.querySelector('.sp-issue').value.trim() || '—',
  }));

  const res = await fetch('/api/spcncl', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ updateDate, items }),
  });
  const data = await res.json();
  if (!res.ok) {
    msgEl.innerHTML = `<div class="msg msg-error">${data.error || 'Lưu thất bại'}</div>`;
    return;
  }
  msgEl.innerHTML = '<div class="msg msg-ok">Đã lưu.</div>';
  loadSpcnclList();
  setTimeout(() => document.getElementById('spcnclEditorCard').classList.add('hidden'), 600);
});

// =================================================================
checkAuth();
</script>
</body>
